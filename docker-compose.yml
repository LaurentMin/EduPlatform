services:
  # 1. Base de données transactionnelle
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: calendar_db
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d calendar_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Stockage Objet (Garage S3)
  garage:
    image: dxflrs/garage:v2.4.1
    ports:
      - "3900:3900" # API S3
      - "3901:3901" # API Web
    volumes:
      - ./garage-data:/var/lib/garage
      - ./garage.toml:/etc/garage.toml
    command: /garage server

  # 3. Backend (Go + Hot-Reload)
  backend:
    image: golang:1.27-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    environment:
      - DB_URL=postgres://devuser:devpassword@postgres:5432/calendar_db?sslmode=disable
      - S3_ENDPOINT=http://garage:3900
    # Installe Air et lance le hot-reload
    command: sh -c "go install github.com/air-verse/air@latest && air"
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started

  # 4. Frontend (Next.js)
  frontend:
    image: node:26-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    env_file:
      - frontend/.env
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend

volumes:
  pg-data: